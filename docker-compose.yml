# ── AI绘图工作台 — Docker Compose ──────────────────────────────────────
# 一键启动完整前后端环境
#
# 使用：
#   docker compose up -d                    # 后台启动
#   docker compose logs -f                  # 查看日志
#   docker compose down                     # 停止并清理
#
# 前置条件：
#   1. 在 backend/.env 中配置 API 密钥
#   2. 确保 Docker Engine 26+ 和 Docker Compose v2+
#
# 访问：
#   http://localhost:5345   (前端 SPA)
#   http://localhost:8000   (后端 API)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-workbench-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-workbench-frontend
    ports:
      - "5345:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
